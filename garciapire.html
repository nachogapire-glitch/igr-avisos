<style>
:root{
  --navy:#1B2D44; --gold:#E8A847; --gold-ink:#1B2D44;
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#1D2433; --muted:#5B6576; --line:#D6DCE5;
  --tile:#FFFFFF; --tile-on:#1B2D44; --tile-on-ink:#FFFFFF; --danger:#C62828; --ok:#2E7D4F;
  color-scheme:light; box-sizing:border-box; height:100%;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1826; --surface:#172338; --ink:#E9EDF3; --muted:#9AA6B8; --line:#2B3A52;
  --tile:#172338; --tile-on:#E8A847; --tile-on-ink:#1B2D44; --danger:#FF6B5E; --ok:#4CAF7A; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F1826; --surface:#172338; --ink:#E9EDF3; --muted:#9AA6B8; --line:#2B3A52;
  --tile:#172338; --tile-on:#E8A847; --tile-on-ink:#1B2D44; --danger:#FF6B5E; --ok:#4CAF7A; color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* cabecera compacta */
.top{flex:none;background:var(--navy);color:#fff;padding:12px 16px 12px;position:relative;overflow:hidden}
.top::after{content:"";position:absolute;right:-30px;bottom:-1px;width:110px;height:16px;background:var(--gold);transform:skewX(-35deg)}
.top img{height:22px;width:auto;display:block}
.who{margin-top:8px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:21px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:70px}
.who small{display:block;font-family:"Barlow",sans-serif;font-weight:500;font-size:14px;opacity:.8}
.bar{flex:none;display:flex;gap:6px;padding:10px 16px 0}
.bar i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.bar i.on{background:var(--gold)}

/* pasos */
.stage{flex:1;min-height:0;position:relative}
.step{position:absolute;inset:0;display:flex;flex-direction:column;padding:12px 16px 8px;min-height:0;overflow-y:auto}
.step[hidden]{display:none}
.step h1{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:clamp(26px,7.5vw,32px);line-height:1.05;margin:2px 0 12px;flex:none}

.list{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.list button{flex:1;max-height:84px;border:2px solid var(--line);background:var(--tile);border-radius:14px;font-weight:700;font-size:20px;text-align:left;padding:0 18px;cursor:pointer}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:8px}
.grid button{border:2px solid var(--line);background:var(--tile);border-radius:12px;font-weight:600;font-size:clamp(14px,4vw,16px);line-height:1.15;padding:6px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:0}
.grid svg{width:clamp(22px,7vw,30px);height:clamp(22px,7vw,30px);flex:none}
.list button[aria-pressed="true"],.grid button[aria-pressed="true"]{background:var(--tile-on);border-color:var(--tile-on);color:var(--tile-on-ink)}

/* paso avería */
.rec-zone{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.mic{width:min(42vw,38vh,170px);aspect-ratio:1;border-radius:50%;border:0;background:var(--navy);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 0 0 8px color-mix(in srgb,var(--gold) 45%,transparent)}
.mic svg{width:42%;height:42%}
.mic.rec{background:var(--danger);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 16px color-mix(in srgb,var(--danger) 25%,transparent)}}
@media (prefers-reduced-motion: reduce){.mic.rec{animation:none}}
:root[data-theme="dark"] .mic:not(.rec){background:var(--gold);color:var(--navy)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mic:not(.rec){background:var(--gold);color:var(--navy)}}
.mic-lbl{font-weight:700;font-size:18px}
.mic-sub{color:var(--muted);font-size:14.5px;max-width:30ch}
.write{width:100%;flex:none;height:clamp(84px,21vh,170px);min-height:0;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;font-size:17px;resize:none}
.tools{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.tools button{border:2px solid var(--line);background:var(--tile);border-radius:14px;padding:14px 4px 12px;font-weight:700;font-size:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:clamp(64px,12vh,104px)}
.tools svg{width:clamp(28px,8vw,36px);height:clamp(28px,8vw,36px)}
.tools button[aria-pressed="true"]{border-color:var(--gold)}
.att{flex:none;display:flex;gap:10px;overflow-x:auto;margin-top:10px;min-height:0;padding:6px 2px 2px}
.att:empty{display:none}
.att .th{position:relative;flex:none;width:64px;height:64px;border-radius:10px;border:1px solid var(--line);background:var(--navy);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;overflow:visible}
.att .th img{width:100%;height:100%;object-fit:cover;border-radius:9px;display:block}
.att .th svg{width:26px;height:26px}
.att button{position:absolute;top:-7px;right:-7px;border:2px solid var(--surface);background:var(--ink);color:var(--surface);border-radius:50%;width:24px;height:24px;line-height:1;cursor:pointer;font-size:15px;padding:0;display:grid;place-items:center}
.state{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.state button{border:2px solid var(--line);background:var(--tile);border-radius:12px;padding:10px 6px;font-weight:700;font-size:16px;cursor:pointer}
.state button[aria-pressed="true"]{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 20%,var(--surface))}

/* resumen */
.sum{flex:1;min-height:0;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 16px}
.sum div{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:baseline}
.sum div:last-child{border-bottom:0}
.sum dt{flex:none;width:84px;color:var(--muted);font-size:15px}
.sum dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.sum a{color:inherit;font-size:14.5px;font-weight:600}

/* pie */
.foot{flex:none;display:flex;gap:8px;padding:8px 16px 12px}
.back{flex:none;width:58px;border:2px solid var(--line);background:var(--surface);border-radius:14px;cursor:pointer;display:grid;place-items:center}
.back svg{width:24px;height:24px}
.next{flex:1;border:0;border-radius:14px;background:var(--gold);color:var(--gold-ink);font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:23px;padding:14px;cursor:pointer}
.next:disabled{opacity:.55;cursor:default}
.err{flex:none;color:var(--danger);font-weight:700;font-size:15px;text-align:center;min-height:0;padding:0 16px}
.err:empty{display:none}

/* hecho */
.done{align-items:center;justify-content:center;text-align:center}
.tick{width:92px;height:92px;border-radius:50%;background:var(--ok);display:grid;place-items:center;color:#fff;margin-bottom:14px;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.tick svg{width:48px;height:48px}
@keyframes pop{from{transform:scale(.3);opacity:0}}
@media (prefers-reduced-motion: reduce){.tick{animation:none}}
.done h1{margin-bottom:6px}
.ref{border:2px dashed var(--gold);border-radius:10px;padding:7px 16px;font-weight:700;font-size:19px;margin:6px 0 14px}
.done p{color:var(--muted);max-width:30ch;margin:0 0 20px}
.ghost{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 22px;font-weight:700;cursor:pointer}
.demo{position:absolute;right:12px;top:10px;z-index:2;background:var(--gold);color:var(--navy);font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px}
.write{font-size:19px;line-height:1.4}
.opt{flex:none;margin:auto 2px 8px;padding-top:10px;color:var(--muted);font-size:15px;font-weight:600}
.tools{margin-top:0}
.recbar{flex:none;display:flex;align-items:center;gap:10px;margin-top:8px;background:var(--danger);color:#fff;border-radius:12px;padding:8px 8px 8px 14px;font-weight:700}
.recbar .dot{width:10px;height:10px;border-radius:50%;background:#fff;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.recbar span:nth-child(2){flex:1}
.recbar button{border:0;background:#fff;color:var(--danger);border-radius:9px;padding:7px 14px;font-weight:700;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.list.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:8px}
.list.two button{max-height:none;font-size:clamp(15px,4.4vw,18px);padding:0 12px;line-height:1.15}
.list.three{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.list.three button{font-size:clamp(13px,3.7vw,16px);padding:0 8px;border-radius:12px}
[hidden]{display:none!important}
</style>
</head>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};

  /* ---- Clientes: en la versión real salen de la pestaña APPS CLIENTES por el código del enlace ---- */
  var code=window.APP_CLIENTE.codigo, cli=window.APP_CLIENTE;
  var LOC=cli.locales.map(function(l){ return typeof l==='string'?{n:l}:l; });
  cli.locales=LOC.map(function(l){return l.n});
  function locInfo(n){ for(var i=0;i<LOC.length;i++) if(LOC[i].n===n) return LOC[i]; return {}; }

  var st={local:cli.locales.length===1?cli.locales[0]:'', texto:'', files:[]};

  $('who').innerHTML='';

  var wl=document.createElement('small'); $('who').appendChild(wl);
  function whoLine(){ wl.textContent = st.local || (cli.locales.length>1 ? cli.locales.length+' locales' : ''); }

  // barra de progreso
  steps.forEach(function(){ $('bar').appendChild(document.createElement('i')); });

  // locales
  if(cli.locales.length>5) $('locales').classList.add('two');
  if(cli.locales.length>12) $('locales').classList.add('three');
  cli.locales.forEach(function(l){
    var b=document.createElement('button'); b.type='button'; b.textContent=l; b.setAttribute('aria-pressed','false');
    b.addEventListener('click',function(){ st.local=l; mark('#locales button',b); whoLine(); setTimeout(go.bind(null,1),180); });
    $('locales').appendChild(b);
  });
  function mark(sel,on){ document.querySelectorAll(sel).forEach(function(x){x.setAttribute('aria-pressed',String(x===on))}); err(''); }

  $('texto').addEventListener('input',function(){ st.texto=$('texto').value; err(''); });

  // adjuntos

  function addFile(f){
    if(f.size>20*1024*1024){ err('El vídeo pasa de 20 MB. Graba uno más corto, de unos 30 segundos.'); return; }

    var box=$('att'); box.innerHTML='';
    st.files.forEach(function(it,i){
      var d=document.createElement('div'); d.className='th'; d.title=it.kind;
      if(it.kind==='Foto'){
        if(!it.url){ try{ it.url=URL.createObjectURL(it.blob); }catch(e){} }
        var im=document.createElement('img'); im.alt='Foto'; im.src=it.url||'';
        im.onerror=function(){ d.innerHTML=ICO.Foto; d.appendChild(x); };
        d.appendChild(im);
      } else { d.innerHTML=ICO[it.kind]||''; }
      var x=document.createElement('button'); x.type='button'; x.textContent='×'; x.setAttribute('aria-label','Quitar '+it.kind.toLowerCase());
      x.addEventListener('click',function(){ if(it.url) try{URL.revokeObjectURL(it.url)}catch(e){} st.files.splice(i,1); renderAtt(); });
      d.appendChild(x); box.appendChild(d);
    });
  }
  $('tFoto').addEventListener('click',function(){$('inFoto').click()});
  $('tVideo').addEventListener('click',function(){$('inVideo').click()});
  ['inFoto','inVideo','inAudio'].forEach(function(id){ $(id).addEventListener('change',function(e){ Array.prototype.forEach.call(e.target.files,addFile); e.target.value=''; }); });

  var rec=null,chunks=[],t0=0,tick=null;
  function stopUI(){ clearInterval(tick); $('recbar').hidden=true; $('mic').disabled=false; }
  $('recStop').addEventListener('click',function(){ if(rec&&rec.state==='recording') rec.stop(); });
  $('mic').addEventListener('click',function(){
    var noMic=function(){ err('El micrófono no está disponible en este móvil. Escribe la avería o manda un vídeo.'); };
    if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder)){ noMic(); return; }
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      chunks=[]; rec=new MediaRecorder(stream);
      rec.ondataavailable=function(e){ if(e.data.size) chunks.push(e.data); };
      rec.onstop=function(){
        stream.getTracks().forEach(function(t){t.stop()}); stopUI();
        var type=rec.mimeType||'audio/webm', b=new Blob(chunks,{type:type});
        try{ addFile(new File([b],'audio-averia.'+(type.indexOf('mp4')>-1?'m4a':'webm'),{type:type})); }catch(e){ addFile(b); }
      };
      rec.start(); t0=Date.now(); $('recbar').hidden=false; $('mic').disabled=true;
      var upd=function(){ var s=Math.floor((Date.now()-t0)/1000); $('recTime').textContent='Grabando '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); if(s>=180) rec.stop(); };
      upd(); tick=setInterval(upd,500);
    }).catch(function(){ noMic(); });
  });

  // navegación
  function err(m){ $('err').textContent=m; }
  function show(){
    document.querySelectorAll('.step').forEach(function(s){ s.hidden=true; });
    $(steps[cur]).hidden=false;
    $('bar').querySelectorAll('i').forEach(function(b,i){ b.classList.toggle('on', i<=cur); });
    $('back').style.visibility = cur===0 ? 'hidden' : 'visible';
    var last=cur===steps.length-1;
    $('next').textContent = last ? 'Enviar aviso' : 'Siguiente';
    err('');
  }
  function valid(){
    var s=steps[cur];
    if(s==='s-local'&&!st.local){ err('Toca el local donde está la máquina.'); return false; }
    if(s==='s-ave'){
      if(rec&&rec.state==='recording'){ err('Toca Parar para terminar de grabar.'); return false; }
      if(!st.texto.trim()&&!st.files.length){ err('Escribe qué avería tienes o envía un audio, foto o vídeo.'); $('texto').focus(); return false; }
    }
    return true;
  }
  function go(d){
    if(d>0&&!valid()) return;
    if(d>0&&cur===steps.length-1){ send(); return; }
    cur=Math.max(0,Math.min(steps.length-1,cur+d)); show();
  }
  $('next').addEventListener('click',function(){ go(1); });
  $('back').addEventListener('click',function(){ go(-1); });

  function row(k,v){ var d=document.createElement('div'), t=document.createElement('dt'), x=document.createElement('dd'); t.textContent=k; x.textContent=v; d.appendChild(t); d.appendChild(x); return d; }
  function summary(){
    var s=$('sum'); s.innerHTML='';
    if(cli.locales.length>1) s.appendChild(row('Local',st.local));
    if(st.texto.trim()) s.appendChild(row('Avería',st.texto.trim()));
    var c={}; st.files.forEach(function(f){c[f.kind]=(c[f.kind]||0)+1});
    var a=Object.keys(c).map(function(k){return c[k]+' '+(k==='Vídeo'?'vídeo':k.toLowerCase())+(c[k]>1?'s':'')}).join(', ');
    if(a) s.appendChild(row('Adjuntos',a));
    s.appendChild(row('Teléfono',cli.tel||'—'));
  }

  // envío (prototipo: sin servidor todavía)
  var ENDPOINT=window.APP_ENDPOINT;
  function b64(blob){ return new Promise(function(ok,ko){ var r=new FileReader(); r.onload=function(){ ok(String(r.result).split(',')[1]||''); }; r.onerror=function(){ ko(r.error); }; r.readAsDataURL(blob); }); }
  function isHeic(f){ return /hei[cf]/i.test(f.type||'') || /\.hei[cf]$/i.test(f.name||''); }
  var heicLib=null;
  function loadHeic(){
    if(heicLib) return heicLib;
    heicLib=new Promise(function(ok,ko){ var s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js'; s.onload=function(){ ok(window.heic2any); }; s.onerror=function(){ heicLib=null; ko(new Error('heic_lib')); }; document.head.appendChild(s); });
    return heicLib;
  }
  async function toJpeg(f){
    var out=await toJpegCanvas(f);
    if(out && out!==f && out.type==='image/jpeg') return out;
    if(isHeic(f) || !f.type){
      try{ var conv=await (await loadHeic())({blob:f,toType:'image/jpeg',quality:0.85}); if(Array.isArray(conv)) conv=conv[0]; var r=await toJpegCanvas(conv); return (r&&r.type==='image/jpeg')?r:conv; }catch(x){}
    }
    return f;
  }
  function toJpegCanvas(f){
    return new Promise(function(res){
      try{
        var url=URL.createObjectURL(f), img=new Image();
        img.onload=function(){
          try{
            var m=1600, w=img.naturalWidth, h=img.naturalHeight, k=Math.min(1,m/Math.max(w,h));
            var c=document.createElement('canvas'); c.width=Math.round(w*k); c.height=Math.round(h*k);
            c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
            c.toBlob(function(bl){ res(bl||f); },'image/jpeg',0.82);
          }catch(x){ res(f); }
        };
        img.onerror=function(){ URL.revokeObjectURL(url); res(f); };
        img.src=url;
      }catch(x){ res(f); }
    });
  }
  function ref(){ var d=new Date(),p=function(n){return String(n).padStart(2,'0')}; return 'AV-'+String(d.getFullYear()).slice(2)+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds()); }
  async function send(){
    var b=$('next'); b.disabled=true; b.textContent='Preparando…';
    try{
      var files=[];
      for(var i=0;i<st.files.length;i++){
        var it=st.files[i];
        var blob=it.kind==='Foto' ? await toJpeg(it.blob) : it.blob;
        if(blob.size>20*1024*1024){ var ex=new Error('size'); ex.userMsg='El '+(it.kind==='Vídeo'?'vídeo':'archivo')+' pasa de 20 MB. Graba uno más corto o quítalo con la ×.'; throw ex; }
        var ext=(blob.type.split('/')[1]||'bin').split(';')[0].replace('quicktime','mov').replace('jpeg','jpg');
        files.push({tipo:it.kind, type:blob.type||'application/octet-stream', name:it.kind.toLowerCase().replace('í','i')+(i+1)+'.'+ext, data:await b64(blob)});
      }
      var payload=JSON.stringify({codigo:code, cliente:cli.nombre, local:st.local, clienteBC:locInfo(st.local).bc||'', envioBC:locInfo(st.local).envio||'', texto:st.texto.trim(), files:files});
      var res=null, last=null;
      for(var t=0;t<3 && !res;t++){
        b.textContent = t ? 'Reintentando…' : (files.length?'Enviando aviso y adjuntos…':'Enviando aviso…');
        if(t) await new Promise(function(r){setTimeout(r,2000*t)});
        try{
          var r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:payload});
          var j=await r.json();
          if(j && j.ok) res=j; else last=new Error((j&&j.error)||('HTTP '+r.status));
        }catch(fe){ last=fe; }
      }
      if(!res){ var ex2=new Error('send'); ex2.userMsg='No se ha podido enviar el aviso. Revisa la conexión y vuelve a tocar Enviar aviso. ('+((last&&last.message)||'error')+')'; throw ex2; }
      $('ref').textContent=res.ref;
      $('doneTxt').textContent='Lo hemos recibido en IGR. Atenderemos su aviso lo más rápido posible.';
      document.querySelectorAll('.step').forEach(function(s){ s.hidden=true; });
      $('s-done').hidden=false; $('foot').hidden=true; $('bar').style.visibility='hidden';
    }catch(e){ err(e&&e.userMsg ? e.userMsg : 'No se ha podido enviar el aviso. Vuelve a tocar Enviar aviso.'); }
    finally{ b.disabled=false; b.textContent='Enviar aviso'; }
  }
  $('again').addEventListener('click',function(){
    st.texto=''; st.files=[]; $('texto').value=''; renderAtt();
    if(cli.locales.length>1) st.local='';
    document.querySelectorAll('[aria-pressed]').forEach(function(x){ x.setAttribute('aria-pressed','false'); });
    whoLine(); cur=0; $('foot').hidden=false; $('bar').style.visibility='visible'; show();
  });

  whoLine(); show();
})();
</script>
</body>
</html>
